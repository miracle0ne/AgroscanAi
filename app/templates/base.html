<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

         <title>{% block title %}AgroScan AI | AI Crop Health Detection for African Farmers{% endblock %}</title>

       <meta
         name="description"
         content="{% block meta_description %}AgroScan AI uses AI-powered image analysis to help farmers identify possible crop diseases, symptoms, and recommended next steps.{% endblock %}">
         <link
            rel="icon"
            type="image/png"
               href="{{ url_for('static', filename='images/favicon.png') }}">
          <link
        rel="canonical"
        href="https://agroscanai.pxxlspace.cv/">

      <meta
        property="og:title"
        content="AgroScan AI | AI Crop Health Detection for African Farmers">

      <meta
        property="og:description"
        content="AgroScan AI uses AI-powered image analysis to help farmers identify possible crop diseases, symptoms, and recommended next steps.">

      <meta
        property="og:type"
        content="website">

      <meta
        property="og:url"
        content="https://agroscanai.pxxlspace.cv/">

     <meta
        property="og:image"
        content="{{ url_for('static', filename='images/og_image.jpeg', _external=True) }}">

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css', v='2') }}">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/auth.css') }}">
  <script
    async
    src="https://www.sabilytics.com/script.js"
    data-site="f33jckbse21c"
    data-domain="agroscanai.pxxlspace.cv"
></script>
</head>

<body class="d-flex flex-column min-vh-100">


  <nav class="navbar navbar-expand-lg ">
    <div class="container">

        <a class="navbar-brand text-success  fw-bold" href="/">
            🌿 AgroScan AI
        </a>

        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#mainNavbar">

            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNavbar">

            <div class="navbar-nav ms-auto ">
                <a class="nav-link text-white" href="/">Home</a>
                <a class="nav-link text-white" href="/scan">Scan Plant</a>
                <a class="nav-link text-white" href="/about">About</a>
                <a class="nav-link text-white" href="{{ url_for('auth.login') }}">Login</a>
                <a class="nav-link text-white" href="{{ url_for('auth.register') }}">Create Account</a>
            </div>

        </div>

    </div>
</nav>
    <main class="flex-grow-1">
        {% block content %}
        {% endblock %}
    </main>
   <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <footer class="bg-dark text-white text-center py-4">
    <p class="mb-1">🌿 AgroScan AI</p>

    <small>
        AI-powered plant disease detection for African farmers.
    </small>

    <div class="mt-2">
        <small>Powered by MiracleSoft</small>
    </div>
</footer>

<script src="{{ url_for('static', filename='js/auth.js') }}"></script>

</body>
</html>
