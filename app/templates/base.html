<!DOCTYPE html>
<html>
<head>
    <title>AgroScan AI</title>
  
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css', v='2') }}">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/auth.css') }}">
  <script
    async
    src="https://www.sabilytics.com/script.js"
    data-site="f33jckbse21c"
    data-domain="agroscanai.pxxlspace.cv"
></script>
</head>

<body class="d-flex flex-column min-vh-100">


  <nav class="navbar navbar-expand-lg">
    <div class="container">

        <a class="navbar-brand text-success fw-bold" href="/">
            🌿 AgroScan AI
        </a>

        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#mainNavbar"
            aria-controls="mainNavbar"
            aria-expanded="false"
            aria-label="Toggle navigation"
        >
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNavbar">

            <div class="navbar-nav ms-auto">

                <a class="nav-link text-white"
                   href="{{ url_for('main.home') }}">
                    Home
                </a>

                {% if current_user.is_authenticated %}

                    <a class="nav-link text-white"
                       href="{{ url_for('main.dashboard') }}">
                        Dashboard
                    </a>

                    <a class="nav-link text-white"
                       href="{{ url_for('main.scan') }}">
                        Scan Plant
                    </a>

                    <a class="nav-link text-white"
                       href="{{ url_for('main.history') }}">
                        History
                    </a>

                    <a class="nav-link text-white"
                       href="{{ url_for('main.profile') }}">
                        Profile
                    </a>

                    <a class="nav-link text-white"
                       href="{{ url_for('auth.logout') }}">
                        Logout
                    </a>

                {% else %}

                    <a class="nav-link text-white"
                       href="{{ url_for('main.about') }}">
                        About
                    </a>

                    <a class="nav-link text-white"
                       href="{{ url_for('auth.login') }}">
                        Login
                    </a>

                    <a class="nav-link text-white"
                       href="{{ url_for('auth.register') }}">
                        Create Account
                    </a>

                {% endif %}

            </div>

        </div>

    </div>
</nav>
    <main class="flex-grow-1">
        {% block content %}
        {% endblock %}
    </main>
   <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <footer class="bg-dark text-white text-center py-4">
    <p class="mb-1">🌿 AgroScan AI</p>

    <small>
        AI-powered plant disease detection for African farmers.
    </small>

    <div class="mt-2">
        <small>Powered by MiracleSoft</small>
    </div>
</footer>

<script src="{{ url_for('static', filename='js/auth.js') }}"></script>

</body>
</html>
